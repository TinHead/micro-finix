# Cross-build each device's example system (QEMU: disk image + runner;
# U-Boot boards: FIT images) on the big host-mode runner. Pushes to main
# also push the result to attic so later builds and local runs
# substitute instead of building.
# The first build compiles the whole musl userland and the kernel.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.device }}
    runs-on: nixos-big
    strategy:
      fail-fast: false
      matrix:
        # outputs differ per boot backend: QEMU devices have a runner and
        # a disk image, U-Boot FIT devices their FIT images
        include:
          - device: qemu-aarch64
            targets: runner diskImage
          - device: qemu-mipsel
            targets: runner diskImage
          - device: dap-x1860
            targets: fit fitShell
          - device: rpi-zero2w
            targets: diskImage
          - device: rpi-zerow
            targets: diskImage
          # examples/ beyond minimal (`device` is the attribute under
          # legacyPackages, so these build examples.<name>)
          - device: examples.service
            targets: runner diskImage
          - device: examples.closure-mode
            targets: runner diskImage
          - device: examples.wifi-node
            targets: diskImage
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: |
          attrs=""
          for t in ${{ matrix.targets }}; do
            attrs="$attrs .#legacyPackages.x86_64-linux.${{ matrix.device }}.config.system.build.$t"
          done
          nix build --print-build-logs --no-link --print-out-paths $attrs | tee out-paths
          nix path-info --derivation $attrs > drv-paths

      - name: closure size
        run: |
          nix path-info -Sh \
            "$(nix eval --raw ".#legacyPackages.x86_64-linux.${{ matrix.device }}.config.system.topLevel")"

      - name: push to attic
        if: github.event_name == 'push'
        run: |
          attic login darker "${ATTIC_ENDPOINT:-https://cache.darker.ro}" "$ATTIC_TOKEN" >/dev/null
          # -j 2: attic's SQLite index has a single writer
          attic push -j 2 darker:darker $(cat out-paths)
          # The build-time closure too (musl cross toolchains, kernels,
          # cross-built userland): otherwise only the builder's store holds it,
          # and GC drops unrooted paths, so every week started over from
          # gcc. Built outputs only: no .drv files, no fixed-output paths
          # (source tarballs). attic skips what cache.nixos.org serves.
          nix-store -qR --include-outputs $(cat drv-paths) | grep -v '\.drv$' > build-closure
          nix path-info --json --json-format 1 $(cat build-closure) \
            | jq -r 'to_entries[] | select(.value.ca == null) | .key' \
            | attic push -j 2 --stdin darker:darker
