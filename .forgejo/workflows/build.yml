# Cross-build each device's example system (QEMU: disk image + runner;
# U-Boot boards: FIT images) on the big host-mode runner. Pushes to main
# also push the result to attic (everything) and to the public
# micro-finix.cachix.org (toolchains and packages, not images) so later
# builds, here and elsewhere, substitute instead of building.
# The first build compiles the whole musl userland and the kernel.
# gh-pr/<n> branches are GitHub pull requests synced to the forge once
# approved: built, never pushed to a cache.
name: build

on:
  push:
    branches: [main, "gh-pr/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.device }}
    runs-on: nixos-big
    strategy:
      fail-fast: false
      matrix:
        # outputs differ per boot backend: QEMU devices have a runner and
        # a disk image, U-Boot FIT devices their FIT images
        include:
          - device: qemu-aarch64
            targets: runner diskImage
          - device: qemu-mipsel
            targets: runner diskImage
          - device: dap-x1860
            targets: fit fitShell
          - device: rpi-zero2w
            targets: diskImage
          - device: rpi-zerow
            targets: diskImage
          # examples/ beyond minimal (`device` is the attribute under
          # legacyPackages, so these build examples.<name>)
          - device: examples.service
            targets: runner diskImage
          - device: examples.closure-mode
            targets: runner diskImage
          - device: examples.wifi-node
            targets: diskImage
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: |
          attrs=""
          for t in ${{ matrix.targets }}; do
            attrs="$attrs .#legacyPackages.x86_64-linux.${{ matrix.device }}.config.system.build.$t"
          done
          # --out-link (a GC root in the job's workspace), not --no-link:
          # the builder's daemon GCs unrooted paths when space runs low, which
          # deleted finished images before the push step
          mkdir -p .gcroots
          nix build --print-build-logs --out-link .gcroots/out --print-out-paths $attrs | tee out-paths
          nix path-info --derivation $attrs > drv-paths

      - name: closure size
        run: |
          nix path-info -Sh \
            "$(nix eval --raw ".#legacyPackages.x86_64-linux.${{ matrix.device }}.config.system.topLevel")"

      - name: build closure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Every output of the build closure that cache.nixos.org doesn't
          # serve (cross toolchains, kernels, cross-built packages, the
          # images), substituted or built so it is in the store: the build
          # above substitutes finished images, which leaves the compilers
          # behind them out of the store and out of the caches.
          # (also packages.<system>.realise-build-closure, for other flakes)
          nix run .#realise-build-closure -- drv-paths build-closure-built

      - name: push to attic
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          attic login darker "${ATTIC_ENDPOINT:-https://cache.darker.ro}" "$ATTIC_TOKEN" >/dev/null
          # -j 2: attic's SQLite index has a single writer
          attic push -j 2 darker:darker $(cat out-paths)
          # all of it: otherwise only the builder's store holds it, and GC drops
          # unrooted paths, so every week started over from gcc
          attic push -j 2 --stdin darker:darker < build-closure-built

      - name: push to cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # The public cache gets what saves other people hours (cross
          # toolchains, kernels, cross-built packages), not what is
          # specific to these example configurations or cheap to redo:
          # disk and filesystem images, boot/slot artifacts, runners,
          # QEMU, unpacked source trees. cachix skips what
          # cache.nixos.org serves.
          grep -v -E -- '(\.img|\.itb|-micro-rpi-boot|-micro-rpi-slot-|-micro-update-bundle-|-run-micro-vm|-qemu-for-vm-tests-|-source(-[0-9][^/]*)?$|-src$)' \
            build-closure-built > cachix-paths || true
          echo "pushing $(wc -l < cachix-paths) paths to micro-finix.cachix.org"
          nix shell nixpkgs#cachix -c cachix push -j 4 micro-finix < cachix-paths
